<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0c10">
<title>Creator Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0c10; --bg2:#15131b; --card:#1b1822; --card2:#221e2c;
  --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.14);
  --txt:#ece9f1; --mut:#9b96a9; --mut2:#6e697d;
  --accent:#f2a65a; --accent2:#e07b4f;
  --ok:#3fb68b; --bad:#d8695f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--txt);
  background:radial-gradient(120% 80% at 100% 0%, #221a2a 0%, transparent 55%),
    radial-gradient(120% 80% at 0% 0%, #1a1622 0%, transparent 50%), var(--bg);
  min-height:100vh;}
#app{max-width:560px;margin:0 auto;padding-bottom:90px;position:relative;min-height:100vh;}
svg{display:block;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

.cc-loading-screen{display:flex;align-items:center;justify-content:center;gap:10px;height:80vh;color:var(--mut);font-size:15px;}
.cc-loading-screen svg{color:var(--accent);}

.cc-auth{max-width:380px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 24px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
.cc-auth .cc-kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:6px;}
.cc-auth h1{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.01em;}
.cc-auth p.sub{color:var(--mut);font-size:14px;margin:8px 0 26px;line-height:1.5;}
.cc-auth .switch{text-align:center;margin-top:18px;color:var(--mut);font-size:13.5px;}
.cc-auth .switch button{background:none;border:none;color:var(--accent);font-size:13.5px;cursor:pointer;text-decoration:underline;}
.cc-auth .msg{font-size:13px;color:var(--accent);margin-top:14px;text-align:center;min-height:18px;line-height:1.4;}

.cc-header{display:flex;align-items:flex-start;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 20px 10px;}
.cc-kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500;}
.cc-h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;line-height:1.05;margin-top:4px;letter-spacing:-.01em;}
.cc-icon-btn{background:var(--card);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer;transition:.15s;}
.cc-icon-btn:active{transform:scale(.94);}
.cc-icon-btn.danger{color:var(--bad);border-color:rgba(216,105,95,.35);}

.cc-strip{display:flex;gap:14px;align-items:center;padding:6px 20px 14px;}
.cc-stat{display:flex;flex-direction:column;}
.cc-stat-n{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1;}
.cc-stat-l{font-size:11px;color:var(--mut2);margin-top:2px;}
.cc-add{margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--accent);color:#1a120a;border:none;font-weight:600;font-size:14px;padding:9px 14px;border-radius:11px;cursor:pointer;transition:.15s;}
.cc-add:active{transform:scale(.96);}

.cc-main{padding:4px 16px 0;}
.cc-section{animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.cc-h2{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:8px 4px 2px;}
.cc-sub{color:var(--mut);font-size:13.5px;margin:0 4px 14px;line-height:1.45;}
.cc-sub-h{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--accent);margin:22px 4px 8px;}

.cc-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px;transition:.15s;}
.cc-card-row{display:flex;gap:10px;align-items:stretch;}
.cc-card-main{flex:1;min-width:0;cursor:pointer;}
.cc-card-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.cc-stage{font-size:10.5px;font-weight:600;letter-spacing:.04em;background:rgba(242,166,90,.14);color:var(--accent);padding:2px 7px;border-radius:6px;}
.cc-plat{font-size:11px;color:var(--mut);}
.cc-rel{font-size:11px;color:var(--mut2);margin-left:auto;}
.cc-rel.over{color:var(--bad);font-weight:500;}
.cc-card-title{font-size:15px;font-weight:500;line-height:1.25;}
.cc-card-cap{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cc-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.cc-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;border:1px solid var(--line2);color:var(--mut);padding:2px 7px;border-radius:20px;}
.cc-badge.ok{color:var(--ok);border-color:rgba(63,182,139,.4);}
.cc-badge.no{color:var(--mut2);}
.cc-badge.win{color:var(--accent);border-color:rgba(242,166,90,.45);}
.cc-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.cc-advance{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:62px;background:var(--card2);border:1px solid var(--line);color:var(--accent);border-radius:11px;cursor:pointer;font-size:10px;font-weight:600;padding:6px;transition:.15s;}
.cc-advance:active{transform:scale(.95);background:rgba(242,166,90,.12);}
.cc-advance svg{width:16px;height:16px;}

.cc-empty{text-align:center;color:var(--mut2);padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.cc-empty p{font-size:13.5px;line-height:1.5;}
.cc-empty b{color:var(--accent);font-weight:600;}
.cc-empty svg{width:26px;height:26px;}

.cc-rel-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s;}
.cc-rel-card:active{border-color:var(--line2);transform:scale(.995);}
.cc-rel-mid{flex:1;min-width:0;}
.cc-rel-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
.cc-rel-meta{font-size:12px;color:var(--mut);margin-top:2px;}
.cc-chev{color:var(--mut2);}
.cc-ring-t{fill:var(--txt);font-size:12px;font-weight:600;font-family:'Outfit';}

.cc-back{background:none;border:none;color:var(--mut);font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 0 10px;}
.cc-back svg{transform:rotate(180deg);width:16px;height:16px;}
.cc-detail-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.cc-stage-group{margin-bottom:18px;}
.cc-stage-label{display:flex;align-items:center;gap:9px;margin:0 4px 9px;}
.cc-stage-label em{font-size:12px;color:var(--mut2);font-style:normal;}

.cc-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.cc-field>span{font-size:12px;color:var(--mut);font-weight:500;padding-left:2px;}
.cc-input{background:var(--card);border:1px solid var(--line2);border-radius:11px;color:var(--txt);font-size:15px;padding:11px 13px;width:100%;outline:none;transition:.15s;}
.cc-input:focus{border-color:var(--accent);}
textarea.cc-input{resize:vertical;line-height:1.45;}
.cc-two{display:grid;grid-template-columns:1fr 1fr;gap:11px;}

.cc-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.cc-pill{background:var(--card);border:1px solid var(--line2);color:var(--mut);font-size:13px;padding:7px 13px;border-radius:20px;cursor:pointer;transition:.15s;}
.cc-pill.on{background:var(--accent);color:#1a120a;border-color:var(--accent);font-weight:600;}
.cc-pill:active{transform:scale(.95);}

.cc-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:linear-gradient(100deg,var(--accent),var(--accent2));color:#1a120a;border:none;font-weight:600;font-size:15.5px;padding:14px;border-radius:13px;cursor:pointer;margin-top:6px;transition:.15s;box-shadow:0 6px 20px rgba(224,123,79,.22);}
.cc-primary:active{transform:scale(.98);}
.cc-primary svg{width:17px;height:17px;}
.cc-ghost{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--card);border:1px solid var(--line2);color:var(--txt);font-size:14px;padding:11px 14px;border-radius:11px;cursor:pointer;transition:.15s;}
.cc-ghost.full{width:100%;}
.cc-ghost.danger{color:var(--bad);border-color:rgba(216,105,95,.35);}
.cc-ghost:active{transform:scale(.98);}
.cc-ghost svg{width:15px;height:15px;}

.cc-filters{display:flex;gap:10px;margin-bottom:14px;}
.cc-select{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:11px;color:var(--txt);font-size:14px;padding:10px;outline:none;}
.cc-data-row{display:flex;gap:10px;}
.cc-data-row .cc-ghost{flex:1;}
.cc-note{font-size:12px;color:var(--mut2);margin:14px 4px 0;line-height:1.5;}
.cc-account{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:6px;}
.cc-account .em{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cc-account .sync{font-size:11px;color:var(--ok);}

.cc-toggle{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;}
.cc-toggle button{flex:1;background:none;border:none;color:var(--mut);font-size:13.5px;padding:9px;border-radius:9px;cursor:pointer;transition:.15s;}
.cc-toggle button.on{background:var(--accent);color:#1a120a;font-weight:600;}

.cc-cal{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:6px;}
.cc-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cc-cal-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
.cc-cal-nav{display:flex;gap:6px;}
.cc-cal-nav button{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:.15s;}
.cc-cal-nav button:active{transform:scale(.92);}
.cc-cal-nav svg{width:16px;height:16px;}
.cc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cc-cal-wd{text-align:center;font-size:10.5px;color:var(--mut2);padding:2px 0 6px;}
.cc-cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:9px;font-size:13px;color:var(--mut);}
.cc-cal-cell.blank{visibility:hidden;}
.cc-cal-cell.today{background:var(--card2);color:var(--txt);font-weight:600;}
.cc-cal-cell.has{cursor:pointer;color:var(--accent);font-weight:600;background:rgba(242,166,90,.10);}
.cc-cal-cell.has:active{transform:scale(.9);}
.cc-cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
.cc-cal-list{margin-bottom:14px;}
.cc-cal-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;}
.cc-cal-item:active{opacity:.7;}
.cc-cal-item .d{font-family:'Fraunces',serif;font-size:13px;color:var(--accent);min-width:52px;}
.cc-cal-item .n{font-size:14.5px;}
.cc-cal-item svg{width:16px;height:16px;margin-left:auto;color:var(--mut2);}
.cc-cal-empty{color:var(--mut2);font-size:13px;text-align:center;padding:18px;line-height:1.5;}

.cc-nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;background:rgba(18,16,24,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.cc-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--mut2);font-size:10.5px;cursor:pointer;padding:5px 0;transition:.15s;}
.cc-nav-btn.on{color:var(--accent);}
.cc-nav-btn svg{width:20px;height:20px;}

.cc-toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);color:var(--txt);font-size:13.5px;padding:11px 18px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:60;animation:rise .3s ease;max-width:90%;text-align:center;}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.cc-modal-bg{position:fixed;inset:0;background:rgba(6,5,9,.6);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.cc-modal{background:var(--bg2);border:1px solid var(--line2);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:sheet .28s cubic-bezier(.2,.8,.2,1);}
@keyframes sheet{from{transform:translateY(100%);}to{transform:none;}}
.cc-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cc-checks{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px;}
.cc-check{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line2);color:var(--mut);font-size:13px;padding:8px 13px;border-radius:11px;cursor:pointer;transition:.15s;}
.cc-check svg{width:13px;height:13px;}
.cc-check.on{color:var(--accent);border-color:var(--accent);background:rgba(242,166,90,.1);font-weight:500;}
.cc-modal-actions{display:flex;gap:10px;}
.cc-link-btn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;margin-left:6px;font-family:inherit;}
.cc-tpl-box{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:6px 14px;}
.cc-tpl-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.cc-tpl-line:last-child{border-bottom:none;}
.cc-tpl-line em{font-size:12px;color:var(--mut2);font-style:normal;}
.cc-tpl-row{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px;}
.cc-tpl-when{display:flex;gap:8px;}
.cc-tpl-when .cc-num{max-width:90px;}
.cc-tpl-rowbtns{display:flex;gap:8px;justify-content:flex-end;}
.cc-pill.sm{font-size:11.5px;padding:5px 10px;}
.cc-tpl-platlabel{font-size:11.5px;color:var(--mut);font-weight:500;margin-top:2px;}
.cc-tpl-platnote{font-size:11.5px;color:var(--mut2);margin-top:3px;}
.cc-vault-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:10px;}
.cc-vault-main{flex:1;min-width:0;}
.cc-vault-name{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;}
.cc-vault-meta{font-size:11.5px;color:var(--mut2);margin-top:2px;}
.cc-vault-go{display:flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line2);color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:10px;cursor:pointer;transition:.15s;}
.cc-vault-go:active{transform:scale(.95);}
.cc-vault-go svg{width:15px;height:15px;}

.cc-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
.cc-chips::-webkit-scrollbar{display:none;}
.cc-chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line2);color:var(--mut);font-size:12.5px;padding:6px 13px;border-radius:18px;cursor:pointer;transition:.15s;font-family:inherit;}
.cc-chip.on{background:var(--accent);color:#1a120a;border-color:var(--accent);font-weight:600;}
.cc-chip:active{transform:scale(.95);}
.cc-cal-count{font-size:9px;color:var(--mut2);line-height:1;}
.cc-cal-cell.has .cc-cal-count{color:var(--accent);}

.cc-intro-bg{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%, #2a1e2e 0%, #0d0c10 60%);}
.cc-intro{position:relative;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);
  border-radius:22px;padding:30px 24px 24px;text-align:center;animation:introIn .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 30px 80px rgba(0,0,0,.55);}
@keyframes introIn{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
.cc-intro-skip{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--mut2);font-size:13px;cursor:pointer;font-family:inherit;}
.cc-intro-icon{width:58px;height:58px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(242,166,90,.18),rgba(224,123,79,.10));border:1px solid rgba(242,166,90,.35);color:var(--accent);}
.cc-intro-tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500;}
.cc-intro-title{font-family:'Fraunces',serif;font-size:24px;font-weight:600;line-height:1.1;margin:6px 0 10px;}
.cc-intro-body{color:var(--mut);font-size:14.5px;line-height:1.55;margin-bottom:22px;}
.cc-intro-body b{color:var(--txt);font-weight:600;}
.cc-intro-body i{color:var(--accent);font-style:italic;}
.cc-idots{display:flex;gap:7px;justify-content:center;margin-bottom:20px;}
.cc-idot{width:7px;height:7px;border-radius:50%;background:var(--line2);transition:.2s;}
.cc-idot.on{background:var(--accent);width:22px;border-radius:4px;}
.cc-wiz-toggle{display:flex;gap:8px;margin-bottom:6px;}
.cc-wiz-yn{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--mut);font-family:inherit;font-size:13.5px;padding:11px;border-radius:11px;cursor:pointer;transition:.15s;}
.cc-wiz-yn.on{background:var(--accent);color:#1a120a;border-color:var(--accent);font-weight:600;}
.cc-wiz-sec{margin-top:14px;text-align:left;}
.cc-wiz-lbl{font-size:12px;color:var(--mut);font-weight:500;margin-bottom:8px;}
.cc-wiz-nav{display:flex;gap:10px;margin-top:4px;}
.cc-intro .cc-wrap{justify-content:flex-start;}

.cc-confirm-bg{position:fixed;inset:0;background:rgba(6,5,9,.66);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
.cc-confirm{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;max-width:360px;width:100%;padding:22px;animation:fade .2s ease;}
.cc-confirm p{font-size:15px;line-height:1.5;margin-bottom:18px;}
.cc-confirm-actions{display:flex;gap:10px;}
.cc-confirm-actions button{flex:1;font-size:14.5px;font-weight:600;padding:12px;border-radius:11px;cursor:pointer;transition:.15s;}
.cc-confirm-actions button:active{transform:scale(.97);}
.cc-confirm-cancel{background:var(--card);color:var(--txt);border:1px solid var(--line2);}
.cc-confirm-yes{background:var(--bad);color:#fff;border:1px solid var(--bad);}

/* ====================== DESKTOP LAYOUT ====================== */
@media (min-width:900px){
  body{background:radial-gradient(110% 60% at 80% 0%, #221a28 0%, transparent 55%), var(--bg);}
  #app{max-width:1120px;min-height:100vh;}
  #app:has(.cc-nav){padding:0 0 48px 252px;}
  /* bottom nav -> left sidebar */
  .cc-nav{top:0;bottom:0;left:0;right:auto;width:220px;max-width:none;margin:0;flex-direction:column;
    justify-content:flex-start;gap:4px;border-top:none;border-right:1px solid var(--line);
    padding:26px 16px;background:rgba(16,14,22,.7);}
  .cc-nav::before{content:"Creator Cockpit";display:block;font-family:'Fraunces',serif;font-size:20px;font-weight:600;
    color:var(--txt);padding:4px 12px 22px;line-height:1.1;}

  S.releases=rels; S.posts=posts; flash("Backup imported & syncing…");
  if(sb && (rels.length||posts.length)){
    if(rels.length) sb.from("releases").upsert(rels.map(relToDb)).then(function(r){ if(r.error)sbErr(r.error); });
    if(posts.length) sb.from("posts").upsert(posts.map(postToDb)).then(function(r){ if(r.error)sbErr(r.error); });
  }
}

function ring(value,size,stroke){
  size=size||40;stroke=stroke||4;var r=(size-stroke)/2,c=2*Math.PI*r,off=c-(value/100)*c;
  return '<svg width="'+size+'" height="'+size+'"><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="'+stroke+'"/>'
    +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="'+stroke+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" stroke-linecap="round" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>'
    +'<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" class="cc-ring-t">'+Math.round(value)+'</text></svg>';
}
function badge(text,cls,withDot,dotColor){
  return '<span class="cc-badge '+(cls||"")+'">'+(withDot?'<span class="cc-dot" style="background:'+dotColor+'"></span>':"")+esc(text)+'</span>';

function postCard(p){
  var sc=STATUS_COLOR[p.status]||"#888";
  var ni=STATUS_ORDER.indexOf(p.status); var next=STATUS_ORDER[Math.min(ni+1,STATUS_ORDER.length-1)];
  var canAdv=next!==p.status; var over=relDay(p.date).indexOf("overdue")>=0;
  return '<div class="cc-card"><div class="cc-card-row">'
    +'<div class="cc-card-main" data-action="edit" data-id="'+p.id+'">'
      +'<div class="cc-card-head"><span class="cc-stage">'+esc(p.stage)+'</span><span class="cc-plat">'+esc(p.platform)+'</span><span class="cc-rel'+(over?" over":"")+'">'+esc(relDay(p.date))+'</span></div>'

      +(p.caption?'<div class="cc-card-cap">'+esc(p.caption)+'</div>':"")

function calendarView(){
  var y=S.cal.y,m=S.cal.m;
  var firstDow=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), tStr=todayStr();
  var f=S.calFilter||"releases";
  var showReleases = (f==="releases");

  // build day map + month list for the active filter
  var byDay={}, monthItems=[];
  function inMonth(ds){ var p=ds.split("-").map(Number); return p[0]===y && p[1]-1===m ? p[2] : 0; }
  if(showReleases){
    S.releases.forEach(function(r){ var d=inMonth(r.date); if(d){ (byDay[d]=byDay[d]||[]).push({kind:"rel",rel:r}); monthItems.push({kind:"rel",date:r.date,rel:r}); } });
  } else {
    var posts = S.posts.filter(function(p){ return f==="all" ? true : p.platform===f; });
    posts.forEach(function(p){ var d=inMonth(p.date); if(d){ (byDay[d]=byDay[d]||[]).push({kind:"post",post:p}); monthItems.push({kind:"post",date:p.date,post:p}); } });
  }
  monthItems.sort(byDate);

  var cells="";
  for(var i=0;i<firstDow;i++)cells+='<div class="cc-cal-cell blank"></div>';
  for(var d=1;d<=days;d++){
    var has=byDay[d];
    var iso=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var open = "";
    if(has){ open = has[0].kind==="rel" ? ' data-action="open-rel" data-id="'+has[0].rel.id+'"' : ' data-action="edit" data-id="'+has[0].post.id+'"'; }
    var dots = has ? '<span class="cc-cal-dot"></span>'+(has.length>1?'<span class="cc-cal-count">'+has.length+'</span>':"") : "";
    cells+='<div class="cc-cal-cell'+(iso===tStr?" today":"")+(has?" has":"")+'"'+open+'><span>'+d+'</span>'+dots+'</div>';
  }
  var wd=""; WD.forEach(function(w){wd+='<div class="cc-cal-wd">'+w+'</div>';});

  // filter chips
  var chips='<button class="cc-chip'+(f==="releases"?" on":"")+'" data-action="calfilter" data-v="releases">Releases</button>'
    +'<button class="cc-chip'+(f==="all"?" on":"")+'" data-action="calfilter" data-v="all">All posts</button>';
  PLATFORMS.forEach(function(p){ chips+='<button class="cc-chip'+(f===p.id?" on":"")+'" data-action="calfilter" data-v="'+p.id+'">'+esc(p.id)+'</button>'; });

  // month list
  var listHTML="";
  if(monthItems.length){
    monthItems.forEach(function(it){
      var rd=Number(it.date.split("-")[2]);
      var dlabel=MONTHS[m].slice(0,3)+" "+rd;
      if(it.kind==="rel"){
        listHTML+='<div class="cc-cal-item" data-action="open-rel" data-id="'+it.rel.id+'"><span class="d">'+dlabel+'</span><span class="n">'+esc(it.rel.name)+'</span>'+ic("chevR")+'</div>';
      } else {
        var sc=STATUS_COLOR[it.post.status]||"#888";
        listHTML+='<div class="cc-cal-item" data-action="edit" data-id="'+it.post.id+'"><span class="d">'+dlabel+'</span><span class="n">'+esc(it.post.title)+' <span style="color:var(--mut2)">· '+esc(it.post.platform)+'</span></span><span class="cc-dot" style="background:'+sc+';margin-left:auto"></span></div>';
      }
    });
  } else {
    var what = showReleases ? "releases" : (f==="all"?"posts":f+" posts");
    listHTML='<div class="cc-cal-empty">No '+esc(what)+' in '+MONTHS[m]+'. Browse with the arrows, or tap Plan to add a release.</div>';
  }

  return '<div class="cc-chips">'+chips+'</div>'
    +'<div class="cc-cal"><div class="cc-cal-head"><div class="cc-cal-title">'+MONTHS[m]+" "+y+'</div>'
    +'<div class="cc-cal-nav"><button data-action="cal" data-dir="-1">'+ic("chevL")+'</button><button data-action="cal" data-dir="0">'+ic("target")+'</button><button data-action="cal" data-dir="1">'+ic("chevR")+'</button></div></div>'
    +'<div class="cc-cal-grid">'+wd+cells+'</div></div>'
    +'<div class="cc-cal-list">'+listHTML+'</div>';
}

function releaseDetail(){

  var rp=S.posts.filter(function(p){return p.releaseId===r.id;});
  var gmap={}, gorder=[];
  rp.forEach(function(p){ if(!gmap[p.stage]){gmap[p.stage]=[];gorder.push(p.stage);} gmap[p.stage].push(p); });
  gorder.sort(function(a,b){
    var ma=gmap[a].map(function(p){return p.date;}).sort()[0]||"";

    +'<button class="cc-back" data-action="back">'+ic("chevR")+' All releases</button>'

/* ====================== SETUP WIZARD ====================== */
var TIMING_PRESETS = [
  {key:"4wk",label:"4 weeks before",offset:-28},
  {key:"3wk",label:"3 weeks before",offset:-21},
  {key:"2wk",label:"2 weeks before",offset:-14},
  {key:"1wk",label:"1 week before",offset:-7},
  {key:"3d",label:"3 days before",offset:-3},
  {key:"1d",label:"1 day before",offset:-1},
  {key:"day",label:"Release day",offset:0},
  {key:"after",label:"Day after",offset:3}
];
var PAID_PLATS = PLATFORMS.filter(function(p){return p.group==="paid";}).map(function(p){return p.id;});
var SOCIAL_PLATS = ["X","Bluesky"];

// Each post type the wizard asks about. defaults reflect the user's real workflow.
function wizPostTypes(){
  return [
    {key:"teaser", title:"Teaser posts", q:"Do you post teasers building up to a drop?",
      hint:"Short hype posts leading up to release day.", defaultPlats:SOCIAL_PLATS.slice(),
      defaultTimes:["1wk","3d","1d"], labelFor:function(t){return "Teaser ("+t.label.replace(" before","")+")";}},
    {key:"presale", title:"Pre-sale push", q:"Do you run pre-sales before a drop?",
      hint:"Pre-sale offers — usually on your paid sites, via posts or DMs.", defaultPlats:PAID_PLATS.slice(),
      defaultTimes:["2wk","1wk"], presale:true, labelFor:function(t){return "Pre-sale ("+t.label.replace(" before","")+")";}},
    {key:"release", title:"Release day", q:"Post everywhere on release day?",
      hint:"The main 'it's live' post.", defaultPlats:ALL_PLAT.slice(),
      defaultTimes:["day"], fixedTimes:["day"], labelFor:function(){return "Release";}},
    {key:"followup", title:"Follow-up bump", q:"Do you post a follow-up after release?",
      hint:"An 'in case you missed it' reminder a few days later.", defaultPlats:ALL_PLAT.slice(),
      defaultTimes:["after"], labelFor:function(){return "Follow-Up";}}
  ];
}

function initWizard(){
  var types=wizPostTypes();
  var answers={};
  types.forEach(function(t){ answers[t.key]={on:t.key==="release"?true:(t.key==="teaser"||t.key==="presale"||t.key==="followup"), times:t.defaultTimes.slice(), platforms:t.defaultPlats.slice()}; });
  S.wiz={ step:0, types:types, answers:answers };
}

function wizardBuildStages(){
  var out=[];
  S.wiz.types.forEach(function(t){
    var a=S.wiz.answers[t.key];
    if(!a.on) return;
    if(!a.platforms.length) return;
    var times = t.fixedTimes ? t.fixedTimes : a.times;
    times.forEach(function(tk){
      var pre=TIMING_PRESETS.filter(function(p){return p.key===tk;})[0]; if(!pre)return;
      out.push({ id:uid(), label:t.labelFor(pre), offset:pre.offset, platforms:a.platforms.slice(), presale:!!t.presale });
    });
  });
  // sort by offset (earliest first)
  out.sort(function(a,b){return a.offset-b.offset;});
  return out;
}

function finishWizard(){
  var stages=wizardBuildStages();
  if(!stages.length){ stages=cloneStages(DEFAULT_STAGES); }
  S.stages=stages; resetPlanStages();
  S.wiz=null; S.wizOpen=false; S.onboarded=true; render();
  if(sb && S.user){ sb.from("settings").upsert({user_id:S.user.id, stages:S.stages, onboarded:true, updated_at:new Date().toISOString()},{onConflict:"user_id"}).then(function(r){ if(r.error)sbErr(r.error); }); }
  flash("Your campaign template is ready — edit it anytime under More.");
}

function wizardOverlay(){
  if(!S.wizOpen || S.view!=="app")return"";
  if(!S.wiz) initWizard();
  var w=S.wiz;
  // total screens: welcome(0) + one per type + review
  var typeCount=w.types.length;
  var totalSteps = 1 + typeCount + 1;
  var dots=""; for(var di=0;di<totalSteps;di++){ dots+='<span class="cc-idot'+(di===w.step?" on":"")+'"></span>'; }

  var inner="";
  if(w.step===0){
    inner='<button class="cc-intro-skip" data-action="wiz-skip">Skip</button>'
      +'<div class="cc-intro-icon">'+ic("rocket",26)+'</div>'
      +'<div class="cc-intro-tag">Welcome, tester</div>'
      +'<h2 class="cc-intro-title">Let\'s set up your campaign</h2>'
      +'<p class="cc-intro-body">You\'re an early tester — thanks for trying this out. It\'s a work in progress, so tell me what\'s rough. First, a few quick questions to build your posting template. You can change all of it later.</p>'
      +'<div class="cc-idots">'+dots+'</div>'
      +'<button class="cc-primary" data-action="wiz-next">Get started</button>';
  } else if(w.step>=1 && w.step<=typeCount){
    var t=w.types[w.step-1]; var a=w.answers[t.key];
    var timeChips="";
    if(!t.fixedTimes){
      TIMING_PRESETS.forEach(function(p){
        if(t.key==="followup" && p.offset<0) return; // follow-up only makes sense at/after release
        if((t.key==="teaser"||t.key==="presale") && p.offset>0) return; // build-up posts are before
        timeChips+='<button class="cc-pill sm'+(a.times.indexOf(p.key)>=0?" on":"")+'" data-action="wiz-time" data-k="'+p.key+'">'+esc(p.label)+'</button>';
      });
    }
    var platChips=""; PLATFORMS.forEach(function(p){ platChips+='<button class="cc-pill sm'+(a.platforms.indexOf(p.id)>=0?" on":"")+'" data-action="wiz-plat" data-v="'+p.id+'">'+esc(p.id)+'</button>'; });
    var body='<div class="cc-wiz-toggle">'
      +'<button class="cc-wiz-yn'+(a.on?" on":"")+'" data-action="wiz-yes">Yes, I do this</button>'
      +'<button class="cc-wiz-yn'+(!a.on?" on":"")+'" data-action="wiz-no">No / skip</button>'
      +'</div>';
    if(a.on){
      if(!t.fixedTimes){ body+='<div class="cc-wiz-sec"><div class="cc-wiz-lbl">When? (pick any)</div><div class="cc-wrap">'+timeChips+'</div></div>'; }
      body+='<div class="cc-wiz-sec"><div class="cc-wiz-lbl">Which platforms?</div><div class="cc-wrap">'+platChips+'</div></div>';
    }
    var last = (w.step===typeCount);
    inner='<button class="cc-intro-skip" data-action="wiz-skip">Skip</button>'
      +'<div class="cc-intro-tag">Question '+w.step+' of '+typeCount+'</div>'
      +'<h2 class="cc-intro-title">'+esc(t.title)+'</h2>'
      +'<p class="cc-intro-body" style="margin-bottom:16px">'+esc(t.q)+' <span style="color:var(--mut2)">'+esc(t.hint)+'</span></p>'
      +body
      +'<div class="cc-idots" style="margin-top:18px">'+dots+'</div>'
      +'<div class="cc-wiz-nav"><button class="cc-ghost" data-action="wiz-back">Back</button>'
      +'<button class="cc-primary" data-action="wiz-next" style="flex:1">'+(last?"Review":"Next")+'</button></div>';
  } else {
    // review
    var stages=wizardBuildStages();
    var rows="";
    if(stages.length){
      stages.forEach(function(s){ rows+='<div class="cc-tpl-line"><div style="flex:1;min-width:0"><span class="cc-stage">'+esc(s.label)+'</span> <em>'+esc(stageTiming(s.offset))+'</em><div class="cc-tpl-platnote">'+esc((s.platforms||[]).join(", "))+'</div></div></div>'; });
    } else { rows='<p class="cc-intro-body">No stages yet — that\'s fine, you can build them later. We\'ll start you with the standard template.</p>'; }
    inner='<button class="cc-intro-skip" data-action="wiz-skip">Skip</button>'
      +'<div class="cc-intro-icon">'+ic("check",26)+'</div>'
      +'<div class="cc-intro-tag">Your campaign</div>'
      +'<h2 class="cc-intro-title">Here\'s your template</h2>'
      +'<p class="cc-intro-body" style="margin-bottom:14px">Every new release builds these posts automatically. Edit anytime under <b>More → Edit campaign template</b>.</p>'
      +'<div class="cc-tpl-box" style="text-align:left;margin-bottom:18px">'+rows+'</div>'
      +'<div class="cc-idots">'+dots+'</div>'
      +'<div class="cc-wiz-nav"><button class="cc-ghost" data-action="wiz-back">Back</button>'
      +'<button class="cc-primary" data-action="wiz-done" style="flex:1">'+ic("check",16)+' Start using it</button></div>';
  }
  return '<div class="cc-intro-bg"><div class="cc-intro">'+inner+'</div></div>';

  var due=S.posts.filter(isDue).sort(byDate);
  var needs=S.posts.filter(needsWork);

  if(S.tab==="today"){
    var cards=""; if(due.length){due.forEach(function(p){cards+=postCard(p);});}else{cards=empty("check","Nothing due. Plan a release or add a post.");}
    body=section("Today","Due today or overdue — tap a card to edit, or advance its status.",cards);
  } else if(S.tab==="releases"){
    if(S.openRelease){ body=releaseDetail(); }
    else{
      var inner='<div class="cc-toggle"><button class="'+(S.relView==="calendar"?"on":"")+'" data-action="relview" data-v="calendar">Calendar</button><button class="'+(S.relView==="list"?"on":"")+'" data-action="relview" data-v="list">List</button></div>';
      if(S.relView==="calendar"){ inner+=calendarView(); }

            +'<div class="cc-rel-mid"><div class="cc-rel-name">'+esc(r.name)+'</div><div class="cc-rel-meta">Release '+esc(fmtDate(r.date))+' · '+rp.length+' posts · '+r.platforms.length+' platforms</div></div>'+ic("chevR")+'</div>';
        });
      } else { inner+=empty("rocket","No releases yet. Tap <b>Plan</b> to build your first one."); }
      body=section("Releases","Tap a release to open its full drip sequence.",inner);
    }
  } else if(S.tab==="plan"){ body=planView(); }
  else if(S.tab==="queue"){ body=queueView(); }

  var navItems=[["today","Today","clock"],["releases","Releases","layers"],["plan","Plan","sparkles"],["queue","Queue","list"],["more","More","more"]];
  var nav=""; navItems.forEach(function(t){ nav+='<button class="cc-nav-btn'+(S.tab===t[0]?" on":"")+'" data-action="tab" data-tab="'+t[0]+'">'+ic(t[2],20)+'<span>'+t[1]+'</span></button>'; });

  var html='<header class="cc-header"><div><div class="cc-kicker">Private Posting Cockpit</div><h1 class="cc-h1">Creator Cockpit</h1></div>'
    +'<button class="cc-icon-btn" data-action="export">'+ic("download")+'</button></header>'
    +'<div class="cc-strip">'
      +'<div class="cc-stat"><span class="cc-stat-n" style="color:'+(due.length?"var(--accent)":"var(--ok)")+'">'+due.length+'</span><span class="cc-stat-l">due / overdue</span></div>'
      +'<div class="cc-stat"><span class="cc-stat-n">'+needs.length+'</span><span class="cc-stat-l">need work</span></div>'
      +'<div class="cc-stat"><span class="cc-stat-n">'+S.releases.length+'</span><span class="cc-stat-l">releases</span></div>'
      +'<button class="cc-add" data-action="add">'+ic("plus",16)+' Post</button>'
    +'</div>'
    +'<main class="cc-main">'+body+'</main>'
    +'<nav class="cc-nav">'+nav+'</nav>'
    +(S.toast?'<div class="cc-toast">'+esc(S.toast)+'</div>':"")
    +editorModal()
    +tplEditorModal()
    +dateEditModal()
    +vaultScheduleModal()
    +confirmModal()

  $("app").innerHTML=html;
}

/* ====================== EVENTS ====================== */
function blankPost(){return {id:uid(),releaseId:null,title:"",date:todayStr(),platform:"OnlyFans",status:"Idea",stage:"Promo",cta:"Subscribe",caption:"",assetLink:"",results:"",assetReady:false,captionReady:false,winner:false,_new:true};}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-action]"); if(!el)return;
  var a=el.getAttribute("data-action"), id=el.getAttribute("data-id");

  if(a==="auth-submit"){ doAuth(); return; }
  if(a==="auth-switch"){ S.authMode=(S.authMode==="signup"?"signin":"signup"); S.authMsg=""; render(); return; }
  if(a==="signout"){ ask("Sign out of this device? Your data stays safe in the cloud.",function(){signOut();},"Sign out"); return; }

  if(a==="tab"){ S.tab=el.getAttribute("data-tab"); if(S.tab==="releases")S.openRelease=null; render(); return; }
  if(a==="add"){ S.editing=blankPost(); render(); return; }
  if(a==="edit"){ var p=S.posts.filter(function(x){return x.id===id;})[0]; if(p){S.editing=Object.assign({},p);render();} return; }
  if(a==="advance"){ advance(id); return; }
  if(a==="open-rel"){ S.tab="releases"; S.openRelease=id; render(); return; }
  if(a==="back"){ S.openRelease=null; render(); return; }
  if(a==="relview"){ S.relView=el.getAttribute("data-v"); render(); return; }
  if(a==="cal"){ var dir=parseInt(el.getAttribute("data-dir"),10);
    if(dir===0){var d=new Date();S.cal={y:d.getFullYear(),m:d.getMonth()};}
    else{var mm=S.cal.m+dir,yy=S.cal.y;if(mm<0){mm=11;yy--;}if(mm>11){mm=0;yy++;}S.cal={y:yy,m:mm};}
    render(); return; }
  if(a==="pill-plat"){ var v=el.getAttribute("data-v"); var i=planSel.platforms.indexOf(v); if(i>=0)planSel.platforms.splice(i,1);else planSel.platforms.push(v); el.classList.toggle("on"); return; }
  if(a==="pill-stage"){ var v2=el.getAttribute("data-v"); var j=planSel.stages.indexOf(v2); if(j>=0)planSel.stages.splice(j,1);else planSel.stages.push(v2); el.classList.toggle("on"); return; }
  if(a==="generate"){
    var name=($("p_name").value||"").trim(), date=$("p_date").value;
    if(!name){flash("Give the release a name first.");return;}
    if(!date){flash("Pick a release date.");return;}
    if(!planSel.platforms.length){flash("Select at least one platform.");return;}
    if(!planSel.stages.length){flash("Select at least one stage.");return;}
    var ordered=S.stages.filter(function(s){return planSel.stages.indexOf(s.id)>=0;}).map(function(s){return s.id;});
    generate(name,date,planSel.platforms.slice(),ordered);
    resetPlanStages();
    return;
  }
  if(a==="seed"){ generate("Sample Drop",addDays(todayStr(),14),["OnlyFans","X","Reddit"],S.stages.map(function(s){return s.id;})); return; }
  if(a==="vault-save"){
    var vname=($("p_name").value||"").trim();
    if(!vname){flash("Give the scene a name first.");return;}
    if(!planSel.platforms.length){flash("Select at least one platform.");return;}
    if(!planSel.stages.length){flash("Select at least one stage.");return;}
    var vordered=S.stages.filter(function(s){return planSel.stages.indexOf(s.id)>=0;}).map(function(s){return s.id;});
    addVault(vname,planSel.platforms.slice(),vordered);
    resetPlanStages();
    render(); return;
  }
  if(a==="vault-schedule"){ S.vaultSchedule=id; render(); return; }
  if(a==="close-vsched"){ if(el.classList.contains("cc-modal-bg") && e.target!==el) return; S.vaultSchedule=null; render(); return; }
  if(a==="vault-do-schedule"){ var vd=$("vs_date").value; if(!vd){flash("Pick a date.");return;} var vid=id; S.vaultSchedule=null; scheduleVaultItem(vid,vd); return; }
  if(a==="vault-del"){ ask("Remove this scene from your Vault?",function(){deleteVault(id);},"Remove"); return; }
  if(a==="save-post"){ savePostFromForm(); return; }
  if(a==="del-post"){ ask("Delete this post?",function(){deletePost(id);},"Delete"); return; }
  if(a==="del-rel"){ var rid=id; ask("Delete this release and all of its posts? This can't be undone.",function(){deleteRelease(rid);},"Delete release"); return; }
  if(a==="close-modal"){ if(el.classList.contains("cc-modal-bg") && e.target!==el) return; S.editing=null; render(); return; }
  if(a==="chk"){ el.classList.toggle("on"); var on=el.classList.contains("on"); var lbl=el.id==="f_winner"?" Winner":(el.id==="f_assetReady"?" Asset ready":" Caption ready"); el.innerHTML=(on?(el.id==="f_winner"?ic("star",13):ic("check",13)):"")+lbl; return; }
  if(a==="change-date"){ S.dateEdit=id; render(); return; }
  if(a==="close-date"){ if(el.classList.contains("cc-modal-bg") && e.target!==el) return; S.dateEdit=null; render(); return; }
  if(a==="date-shift"){ var nd=$("dt_new").value; if(!nd){flash("Pick a date.");return;} var rid2=id; S.dateEdit=null; changeReleaseDate(rid2,nd,true); return; }
  if(a==="date-only"){ var nd2=$("dt_new").value; if(!nd2){flash("Pick a date.");return;} var rid3=id; S.dateEdit=null; changeReleaseDate(rid3,nd2,false); return; }
  if(a==="calfilter"){ S.calFilter=el.getAttribute("data-v"); render(); return; }
  if(a==="wiz-next"){ S.wiz.step++; render(); return; }
  if(a==="wiz-back"){ if(S.wiz.step>0)S.wiz.step--; render(); return; }
  if(a==="wiz-skip"){
    S.wiz=null; S.wizOpen=false;
    if(!S.onboarded){ S.stages=cloneStages(DEFAULT_STAGES); resetPlanStages(); S.onboarded=true; if(sb&&S.user){sb.from("settings").upsert({user_id:S.user.id,stages:S.stages,onboarded:true,updated_at:new Date().toISOString()},{onConflict:"user_id"}).then(function(r){if(r.error)sbErr(r.error);});} }
    render(); return;
  }
  if(a==="wiz-done"){ finishWizard(); return; }
  if(a==="wiz-yes"){ var tt=S.wiz.types[S.wiz.step-1]; S.wiz.answers[tt.key].on=true; render(); return; }
  if(a==="wiz-no"){ var tt2=S.wiz.types[S.wiz.step-1]; S.wiz.answers[tt2.key].on=false; render(); return; }
  if(a==="wiz-time"){ var tt3=S.wiz.types[S.wiz.step-1]; var ans=S.wiz.answers[tt3.key]; var tk=el.getAttribute("data-k"); var ix=ans.times.indexOf(tk); if(ix>=0)ans.times.splice(ix,1); else ans.times.push(tk); render(); return; }
  if(a==="wiz-plat"){ var tt4=S.wiz.types[S.wiz.step-1]; var ans2=S.wiz.answers[tt4.key]; var pv2=el.getAttribute("data-v"); var ix2=ans2.platforms.indexOf(pv2); if(ix2>=0)ans2.platforms.splice(ix2,1); else ans2.platforms.push(pv2); render(); return; }
  if(a==="launch-wizard"){ ask("Run the guided setup? It rebuilds your campaign template from your answers. Your existing releases and posts stay exactly as they are.",function(){ initWizard(); S.wizOpen=true; render(); },"Run setup"); return; }
  if(a==="edit-tpl"){ S.tplEdit=cloneStages(S.stages); render(); return; }
  if(a==="close-tpl"){ if(el.classList.contains("cc-modal-bg") && e.target!==el) return; S.tplEdit=null; render(); return; }
  if(a==="tpl-add"){ syncTplFromDOM(); S.tplEdit.push({id:uid(),label:"New stage",offset:-2,platforms:ALL_PLAT.slice()}); render(); return; }
  if(a==="tpl-plat"){ syncTplFromDOM(); var pi=parseInt(el.getAttribute("data-i"),10); var pv=el.getAttribute("data-v"); var st=S.tplEdit[pi]; if(st){ st.platforms=st.platforms||[]; var k=st.platforms.indexOf(pv); if(k>=0)st.platforms.splice(k,1); else st.platforms.push(pv); } render(); return; }
  if(a==="tpl-remove"){ syncTplFromDOM(); var ri=parseInt(el.getAttribute("data-i"),10); S.tplEdit.splice(ri,1); render(); return; }
  if(a==="tpl-up"){ syncTplFromDOM(); var ui=parseInt(el.getAttribute("data-i"),10); if(ui>0){var t=S.tplEdit[ui-1];S.tplEdit[ui-1]=S.tplEdit[ui];S.tplEdit[ui]=t;} render(); return; }
  if(a==="tpl-down"){ syncTplFromDOM(); var di=parseInt(el.getAttribute("data-i"),10); if(di<S.tplEdit.length-1){var t2=S.tplEdit[di+1];S.tplEdit[di+1]=S.tplEdit[di];S.tplEdit[di]=t2;} render(); return; }
  if(a==="tpl-reset"){ S.tplEdit=cloneStages(DEFAULT_STAGES); render(); return; }
  if(a==="tpl-save"){
    syncTplFromDOM();
    var clean=S.tplEdit.filter(function(s){return (s.label||"").trim();});
    if(!clean.length){ flash("Add at least one stage."); return; }
    var noPlat=clean.filter(function(s){return !(s.platforms&&s.platforms.length);});
    if(noPlat.length){ flash('"'+noPlat[0].label.trim()+'" has no platforms selected — pick at least one or remove the stage.'); return; }
    clean.forEach(function(s){ s.label=s.label.trim(); if(!s.id)s.id=uid(); });
    S.stages=clean; S.tplEdit=null; resetPlanStages(); flash("Campaign template saved."); saveTemplate(false); render(); return;
  }
  if(a==="export"){ exportJSON(); return; }
  if(a==="import"){ $("importFile").click(); return; }
  if(a==="clear"){ ask("Clear ALL releases and posts from the cloud? This can't be undone.",function(){clearAll();},"Clear all"); return; }
  if(a==="confirm-cancel"){ if(el.classList.contains("cc-confirm-bg") && e.target!==el) return; S.confirm=null; render(); return; }
  if(a==="confirm-yes"){ var fn=S.confirm&&S.confirm.onYes; S.confirm=null; render(); if(fn)fn(); return; }
});

function syncTplFromDOM(){
  if(!S.tplEdit)return;
  S.tplEdit.forEach(function(s,i){
    var le=$("tpl_label_"+i), ne=$("tpl_num_"+i), de=$("tpl_dir_"+i);
    if(le)s.label=le.value;
    if(de){ var dir=de.value; var num=ne?(parseInt(ne.value,10)||0):0; s.offset = dir==="before"?-num:(dir==="after"?num:0); }
  });
}

document.addEventListener("change",function(e){
  var el=e.target.closest("[data-action]"); if(!el)return;
  var a=el.getAttribute("data-action");
  if(a==="filter-plat"){ S.qPlat=el.value; render(); }
  else if(a==="filter-status"){ S.qStatus=el.value; render(); }
  else if(a==="tpl-dir"){ syncTplFromDOM(); render(); }
});

$("importFile").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0];
  if(f){ var rd=new FileReader(); rd.onload=function(){ try{importData(JSON.parse(rd.result));}catch(err){flash("Couldn't read that file.");} }; rd.readAsText(f); }
  e.target.value="";
});

if(sb && sb.auth && sb.auth.onAuthStateChange){
  sb.auth.onAuthStateChange(function(event,session){
    if(event==="SIGNED_OUT"){ S.user=null; S.view="auth"; render(); }
  });
}

boot();
</script>
</body>
</html>
